# DRAFT ONLY — Orchestrator (WS0/WS7) merges into eswasaone.aiceafrica.com.conf
# DO NOT enable blindly.
#
# ADMIN-ONLY WARNING:
#   Frappe Desk is a full system-administration UI (users, roles, Company,
#   accounting, email). Exposing /desk on the public hostname without strong
#   authentication, IP allowlisting, and an explicit ops decision is unsafe.
#   Prefer localhost + SSH tunnel: http://127.0.0.1:8020 (see engine/HANDOFF_DESK.md).
#
# When merging: place BEFORE the catch-all `location /` that proxies the Service Portal.
# Consider restricting with `allow`/`deny`, basic auth, or SSO — not included here.

upstream eswasaone_frappe_desk {
  server 127.0.0.1:8020;
  keepalive 8;
}

