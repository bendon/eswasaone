# Staff Authorisation — custom HR competence record (brief §6.2).

doctype: Staff Authorisation
module: hr
workflow_name: Staff Authorisation
submit_gate: null
emit: true
phase: declare
allow_self_approval_default: 0
approvals_family: approve
board_rollup: hr.summary
guards:
  [expected_state, idempotency_key, eswasa_hr.authorisations.authorised_reason, eswasa_hr.declarations.can_act, eswasa_hr.leave.on_leave]
notes: >
  The named head of the person's department (Department.custom_head) approves, as one ToDo, never a
  role pool; must differ from the employee and the preparer (four-eyes). eswasa_hr.authorisations.decide
  is the approval handler. Assignment guards (plan 07): eswasa_hr.competence.assignment_error runs the
  authorisation on the work date, the signed declaration (and declared interests), then approved leave,
  for Audit, Field Visit, the certification decision (Certificate) and Calibration Job.

# PROVISIONAL (brief §12.1; confirm with ESWASA): the head of department decides within 5 days.
# No escalation ladder yet; nothing escalates to a role pool.
sla: {days: 5, calendar: calendar, escalate_to: null, provisional: true}

display:
  customer: {}
  staff:
    Draft: In training
    Approved: Current

states:
  - {name: Draft, owner_role: HR User, allow_edit: HR User}
  - {name: Approved, owner_role: HR Manager, allow_edit: HR Manager, style: Success}

transitions:
  - action: Approve
    from: Draft
    to: Approved
    actor: head of department (named)
    approvals_family: approve
  - action: Withdraw
    from: Approved
    to: Draft
    actor: HR Manager
    reason: required
    approvals_family: do
