openapi: 3.1.0
info:
  title: EswasaOne Core BFF
  version: 0.1.0
  description: >
    Single BFF contract for Service Portal and Institution Portal.
    All writes are confirm-before-commit and execute as the Frappe user.
servers:
  - url: https://eswasaone.aiceafrica.com/api
    description: Public (nginx → Core :8015)
  - url: http://127.0.0.1:8015/api
    description: Local Core
tags:
  - name: home
  - name: certification
  - name: standards
  - name: estore
  - name: verify
  - name: agent
  - name: ingest
  - name: identity
  - name: adapters
  - name: governance

paths:
  /home/institution:
    get:
      tags: [home]
      operationId: getInstitutionHome
      summary: Institution portal KPIs, module states, and feed preview
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionHome" }

  /home/service:
    get:
      tags: [home]
      operationId: getServiceHome
      summary: Service portal stats, recent activity, alerts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceHome" }

  /certification/schemes:
    get:
      tags: [certification]
      operationId: listCertificationSchemes
      description: Public catalogue of active Certification Schemes. `code` is the value CreateCertificationApplication.scheme accepts.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CertificationScheme" }

  /certification/applications:
    get:
      tags: [certification]
      operationId: listCertificationApplications
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CertificationApplication" }
    post:
      tags: [certification]
      operationId: createCertificationApplication
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCertificationApplication" }
      responses:
        "201":
          description: Created (pending confirmation if mutates confirm flow)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificationApplication" }

  /certification/applications/{id}:
    get:
      tags: [certification]
      operationId: getCertificationApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificationApplication" }

  /certification/applications/{id}/act:
    post:
      tags: [certification]
      operationId: actCertificationApplication
      summary: Workflow act (map §5) — guarded apply_workflow
      description: >
        Preferred transition API. Core passes values through; Frappe enforces
        expected_state, reason, idempotency (L4), and ToDo allocation (L1–L2).
        `/advance` remains as a compatibility alias.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActBody"
      responses:
        "200":
          description: Transition applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificationApplication" }

  /standards/work-items/{id}/act:
    post:
      tags: [standards]
      operationId: actWorkItem
      summary: Workflow act for Work Item (map §5)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActBody"
      responses:
        "200":
          description: Transition applied

  /metrology/jobs/{id}/act:
    post:
      tags: [metrology]
      operationId: actCalibrationJob
      summary: Workflow act for Calibration Job (map §5)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActBody"
      responses:
        "200":
          description: Transition applied

  /tbt/notifications/{id}/act:
    post:
      tags: [tbt]
      operationId: actTbtNotification
      summary: Workflow act for TBT Notification (map §5)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActBody"
      responses:
        "200":
          description: Transition applied

  /governance/resolutions/{id}/act:
    post:
      tags: [governance]
      operationId: actBoardResolution
      summary: Workflow act for Board Resolution (map §5)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActBody"
      responses:
        "200":
          description: Transition applied

  /governance/packs/{id}/act:
    post:
      tags: [governance]
      operationId: actBoardPack
      summary: Workflow act for Board Pack (map §5)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActBody"
      responses:
        "200":
          description: Transition applied

  /field/visits/{id}/act:
    post:
      tags: [field]
      operationId: actFieldVisit
      summary: Workflow act for Field Visit (map §5.7)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActBody"
      responses:
        "200":
          description: Transition applied

  /certification/applications/{id}/advance:
    post:
      tags: [certification]
      operationId: advanceCertificationApplication
      deprecated: true
      summary: Compatibility alias for /act
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActBody"
      responses:
        "200":
          description: Advanced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificationApplication" }

  /certification/quotes:
    get:
      tags: [certification]
      operationId: listCertificationQuotes
      summary: Quote RFQs + issued ERPNext Quotations linked to applications
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CertificationQuote" }
    post:
      tags: [certification]
      operationId: createCertificationQuote
      summary: Citizen /certification/quote RFQ — creates a draft Quotation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCertificationQuote" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificationQuote" }

  /certification/quotes/{id}/issue:
    post:
      tags: [certification]
      operationId: issueCertificationQuote
      summary: Issue fee lines on an RFQ Quotation, or run issue_quotation on an Application
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueCertificationQuote" }
      responses:
        "200":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificationQuote" }

  /certification/quotes/{id}/pdf:
    get:
      tags: [certification]
      operationId: getCertificationQuotePdf
      summary: Ensure quotation PDF is stored in S3 and return a download URL
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  application_id: { type: string }
                  download_url: { type: string }
                  media_key: { type: string }
                  backend: { type: string }
                  cached: { type: boolean }

  /certification/audits/overdue:
    get:
      tags: [certification]
      operationId: listOverdueAudits
      security: [{ bearerAuth: [] }]
      parameters:
        - name: auditor
          in: query
          schema: { type: string }
        - name: scheme
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditSummary" }

  /standards:
    get:
      tags: [standards]
      operationId: listStandards
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: sector
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StandardSummary" }

  /estore/checkout:
    post:
      tags: [estore]
      operationId: estoreCheckout
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, confirm]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [standard_code, qty]
                    properties:
                      standard_code: { type: string }
                      qty: { type: integer, minimum: 1 }
                payment_method:
                  type: string
                  enum: [momo, invoice]
                confirm: { type: boolean }
      responses:
        "200":
          description: Checkout initiated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResult" }

  /verify/{token}:
    get:
      tags: [verify]
      operationId: verifyToken
      summary: Public certificate / mark verification
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationResult" }

  /agent/ask:
    post:
      tags: [agent]
      operationId: agentAsk
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentAskRequest" }
      responses:
        "200":
          description: Structured answer / pending action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentAskResponse" }

  /ingest/applicability:
    post:
      tags: [ingest]
      operationId: checkApplicability
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                jurisdiction: { type: string }
                sector: { type: string }
                hs_code: { type: string }
      responses:
        "200":
          description: Guided applicability result with citations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicabilityResult" }

  /auth/login:
    post:
      tags: [identity]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }

  /auth/me:
    get:
      tags: [identity]
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }

  /adapters/momo/callback:
    post:
      tags: [adapters]
      operationId: momoCallback
      summary: MTN MoMo payment callback
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Accepted

  # --- Wave 1 Frontend Workflow Capture (F0b) ---
  /certification/audits/{id}:
    patch:
      tags: [certification]
      operationId: patchCertificationAudit
      summary: Schedule, assign, complete, or submit Field outcome
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditPatchBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /certification/certificates/{id}/revoke:
    post:
      tags: [certification]
      operationId: revokeCertificate
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "200":
          description: Revoked

  /certification/certificates/{id}/renew:
    post:
      tags: [certification]
      operationId: renewCertificate
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "200":
          description: Renewed

  /certification/certificates/{id}/pdf:
    get:
      tags: [certification]
      operationId: getCertificatePdf
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url: { type: string, nullable: true }

  /standards/ballots/{id}/vote:
    post:
      tags: [standards]
      operationId: voteBallot
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BallotVoteBody" }
      responses:
        "200":
          description: Vote recorded

  /approvals/{doctype}/{name}/escalate:
    post:
      tags: [identity]
      operationId: escalateApproval
      summary: Operator R-A2 escalate for SLA-breached queue item
      security: [{ bearerAuth: [] }]
      parameters:
        - name: doctype
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EscalateBody" }
      responses:
        "200":
          description: Escalation result

  /field/me/audits:
    get:
      tags: [certification]
      operationId: listFieldMyAudits
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Audits assigned to current auditor

  /field/me/summary:
    get:
      tags: [certification]
      operationId: getFieldMySummary
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Next audit, schedule chips, unread

  /estore/cart:
    post:
      tags: [estore]
      operationId: upsertEstoreCart
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartBody" }
      responses:
        "200":
          description: Cart snapshot

  /estore/orders/{id}:
    get:
      tags: [estore]
      operationId: getEstoreOrder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Order status (poll for MoMo)

  /estore/licences/{id}/download:
    get:
      tags: [estore]
      operationId: downloadEstoreLicence
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Signed licence download URL

  /hr/access-requests:
    get:
      tags: [identity]
      operationId: listAccessRequests
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Access request queue
    post:
      tags: [identity]
      operationId: createAccessRequest
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequestBody" }
      responses:
        "200":
          description: Created

  /hr/expense-claims:
    get:
      tags: [identity]
      operationId: listExpenseClaims
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Expense claims for current user

  /hr/me:
    get:
      tags: [hr]
      operationId: getHrMe
      summary: My HR — the caller's own record, line manager, leave approver, balances and recent leave
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Own HR record. linked=false when the login has no Employee record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrMe" }
        "503":
          description: Frappe unavailable

  /hr/me/declaration:
    get:
      tags: [hr]
      operationId: getMyDeclaration
      summary: This year's impartiality and confidentiality declaration for the caller
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Declaration (status outstanding | draft | signed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrMyDeclaration" }
        "404":
          description: Login not linked to an Employee record
    post:
      tags: [hr]
      operationId: signMyDeclaration
      summary: Sign this year's declaration (own record only; rules enforced in eswasa_hr)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrSignDeclarationBody" }
      responses:
        "200":
          description: Signed declaration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrMyDeclaration" }
        "400":
          description: confirm=false
        "422":
          description: Rule failed (nothing listed, confidentiality not accepted, no signature, already signed)

  /hr/impartiality:
    get:
      tags: [hr]
      operationId: getDeclarationRegister
      summary: Signed and outstanding declarations for the year (HR roles only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Register
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrDeclarationRegister" }
        "403":
          description: Not HR

  /hr/impartiality/remind:
    post:
      tags: [hr]
      operationId: remindDeclarations
      summary: Open a task for everyone who hasn't signed (idempotent; R-H5)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrRemindBody" }
      responses:
        "200":
          description: Tasks opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrRemindResult" }

  /hr/competence/matrix:
    get:
      tags: [hr]
      operationId: getCompetenceMatrix
      summary: People × competences with cover per competence (HR roles only)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrCompetenceMatrix" }

  /hr/competence/expiring:
    get:
      tags: [hr]
      operationId: listExpiringAuthorisations
      summary: Authorisations ending within N days (default 60)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 60 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/HrAuthorisationRow" } } } }

  /hr/competence/authorisations/{name}:
    get:
      tags: [hr]
      operationId: getAuthorisation
      summary: One authorisation with evidence (own, or HR)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrAuthorisationDetail" }

  /hr/competence/authorisations:
    post:
      tags: [hr]
      operationId: requestAuthorisation
      summary: HR records an authorisation; it goes to the head of the person's department in Approvals
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrAuthorisationRequestBody" }
      responses:
        "201":
          description: Draft created and routed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrAuthorisationDetail" }
        "422":
          description: Rule failed (no department head, no evidence, head is the person)

  /hr/me/competence:
    get:
      tags: [hr]
      operationId: listMyAuthorisations
      summary: The caller's own authorisations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/HrAuthorisationRow" } } } }

  /hr/me/competence/renewal:
    post:
      tags: [hr]
      operationId: askForRenewal
      summary: Employee asks HR to renew an authorisation (a task for each HR Manager)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrRenewalBody" }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { type: object, properties: { sent_to: { type: integer } } }

  /hr/recruitment/vacancies:
    get:
      tags: [hr]
      operationId: listVacancies
      summary: Approved posts with a vacancy (Staffing Plan minus active employees minus open requisitions)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Vacant posts
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/HrVacancy" } } } }

  /hr/recruitment:
    get:
      tags: [hr]
      operationId: listRequisitions
      summary: Requisitions with their opening and applicant counts (HR only)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Requisitions
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/HrRequisition" } } } }

  /hr/recruitment/requisitions:
