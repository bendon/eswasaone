<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#313391">
<title>{{ title }}</title>
<link rel="icon" href="/assets/eswasa_certification/images/favicon.ico">
<link rel="stylesheet" href="{{ eswasa_css }}">
</head>
<body class="es-auth">
{% include "eswasa_certification/templates/includes/eswasa_line_icons.html" %}

<main class="es-card" id="es-card">
  <div class="es-head">
    <img class="es-logo" src="{{ eswasa_logo }}" alt="EswasaOne">
    <div class="es-title-text">
      <h1>{{ _("Set Password") }}</h1>
      <p class="es-subtitle" id="es-subtitle">{{ _("Use strong passwords.") }}</p>
    </div>
  </div>

  <div class="es-banner ok" id="es-ok" hidden>
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-check-circle"></use></svg>
    <span id="es-ok-text"></span>
  </div>
  <div class="es-banner err" id="es-err" hidden>
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-alert-circle"></use></svg>
    <span id="es-err-text"></span>
  </div>

  <form class="es-form" id="es-form" novalidate>
    <div class="es-field" id="es-old-field" {% if has_key %}hidden{% endif %}>
      <label class="es-label" for="old_password">{{ _("Old Password") }}</label>
      <div class="es-input-wrap has-icon-left has-icon-right">
        <svg class="es-icon-left" width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-lock"></use></svg>
        <input class="es-input" id="old_password" type="password" placeholder="•••••" autocomplete="current-password">
        <svg class="es-icon-right" toggle="#old_password" width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-preview"></use></svg>
      </div>
    </div>

    <div class="es-field">
      <label class="es-label" for="new_password">{{ _("New Password") }}</label>
      <div class="es-input-wrap has-icon-left has-icon-right">
        <svg class="es-icon-left" width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-lock"></use></svg>
        <input class="es-input" id="new_password" type="password" placeholder="--------" autocomplete="new-password">
        <svg class="es-icon-right" toggle="#new_password" width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-preview"></use></svg>
      </div>
      <div class="es-strength" id="es-strength" hidden>
        <div class="es-strength-track"><div class="es-strength-fill" id="es-strength-fill"></div></div>
        <div class="es-strength-label" id="es-strength-label"></div>
      </div>
      <div class="es-hint">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><use href="#es-line-alert-circle"></use></svg>
        <span>{{ _("Use a minimum of 8 characters (case sensitive) with at least one number or special character.") }}</span>
      </div>
    </div>

    <div class="es-field">
      <label class="es-label" for="confirm_password">{{ _("Confirm New Password") }}</label>
      <div class="es-input-wrap has-icon-left has-icon-right">
        <svg class="es-icon-left" width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-lock"></use></svg>
        <input class="es-input" id="confirm_password" type="password" placeholder="--------" autocomplete="new-password">
        <svg class="es-icon-right" toggle="#confirm_password" width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-preview"></use></svg>
      </div>
      <p class="es-field-error" id="es-mismatch"></p>
    </div>

    <button class="es-btn es-btn-primary" type="submit" id="es-submit" disabled>
      {{ _("Confirm") }}
    </button>
  </form>

  <div class="es-foot">
    <a href="/login">{{ _("Back to sign in") }}</a>
  </div>
</main>

<script>
(function () {
  var key = new URLSearchParams(location.search).get("key");
  var passwordExpired = new URLSearchParams(location.search).get("password_expired");
  var oldField = document.getElementById("es-old-field");
  var oldPwd = document.getElementById("old_password");
  var newPwd = document.getElementById("new_password");
  var confirmPwd = document.getElementById("confirm_password");
  var submit = document.getElementById("es-submit");
  var strengthBox = document.getElementById("es-strength");
  var strengthFill = document.getElementById("es-strength-fill");
  var strengthLabel = document.getElementById("es-strength-label");
  var mismatch = document.getElementById("es-mismatch");
  var okBanner = document.getElementById("es-ok");
  var okText = document.getElementById("es-ok-text");
  var errBanner = document.getElementById("es-err");
  var errText = document.getElementById("es-err-text");
  var subtitle = document.getElementById("es-subtitle");
  var csrfToken = "{{ csrf_token }}";

  // If a reset key is present, hide the Old Password field (the user is
  // setting a password via an email link and has no old password to enter).
  // Without a key (logged-in change / first set), show it.
  if (key) {
    oldField.hidden = true;
  } else {
    oldField.hidden = false;
  }
  if (passwordExpired) {
    subtitle.textContent = "{{ _('Your password has expired. Please set a new password.') }}";
  }

  function showErr(msg) { errText.textContent = msg; errBanner.hidden = false; okBanner.hidden = true; }
  function showOk(msg) { okText.textContent = msg; okBanner.hidden = false; errBanner.hidden = true; }
  function clearBanners() { okBanner.hidden = true; errBanner.hidden = true; }

  // Toggle password visibility
  document.querySelectorAll("[toggle]").forEach(function (el) {
    el.addEventListener("click", function () {
      var target = document.querySelector(el.getAttribute("toggle"));
      var isPwd = target.type === "password";
      target.type = isPwd ? "text" : "password";
      el.querySelector("use").setAttribute("href", isPwd ? "#es-line-hide" : "#es-line-preview");
    });
  });

  var strengthTimer = null;
  var COLORS = ["red", "red", "orange", "blue", "green"];
  var LABELS = {
    red: "{{ _('Poor') }}", orange: "{{ _('Average') }}",
    blue: "{{ _('Good') }}", green: "{{ _('Great!') }}"
  };

  function setStrength(color) {
    if (!color) { strengthBox.hidden = true; return; }
    strengthFill.className = "es-strength-fill s-" + color;
    strengthFill.style.width = ({ red: 25, orange: 50, blue: 75, green: 100 })[color] + "%";
    strengthLabel.textContent = LABELS[color] || "";
    strengthLabel.style.color = ({
      red: "var(--red)", orange: "var(--amber)", blue: "var(--blue)", green: "var(--green)"
    })[color];
    strengthBox.hidden = false;
  }

  function testStrength() {
    if (!newPwd.value) { strengthBox.hidden = true; return; }
    fetch("/api/method/frappe.core.doctype.user.user.test_password_strength", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": csrfToken },
      body: JSON.stringify({ key: key || "", old_password: oldPwd.value, new_password: newPwd.value })
    })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        var m = r.message || {};
        if (m.score !== undefined && m.score !== null) {
          setStrength(COLORS[m.score]);
        }
      })
      .catch(function () {});
  }

  newPwd.addEventListener("keyup", function () {
    clearTimeout(strengthTimer);
    strengthTimer = setTimeout(testStrength, 200);
  });

  function validate() {
    var np = newPwd.value, cp = confirmPwd.value, op = oldPwd.value;
    var common = np && cp && np === cp;
    mismatch.textContent = "";
    if (cp && np !== cp) { mismatch.textContent = "{{ _('Passwords do not match') }}"; }
    if (np && op && op === np) {
      mismatch.textContent = "{{ _('New password cannot be the same as old password') }}";
    }
    var ready = (key || op) && np && cp && np === cp && np !== op;
    submit.disabled = !ready;
  }

  ["keyup", "paste", "change"].forEach(function (ev) {
    oldPwd.addEventListener(ev, validate);
    newPwd.addEventListener(ev, validate);
    confirmPwd.addEventListener(ev, validate);
  });

  document.getElementById("es-form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (submit.disabled) return;
    submit.disabled = true;
    var original = submit.textContent;
    submit.innerHTML = '<span class="es-spin"></span>' + "{{ _('Setting…') }}";
    clearBanners();

    fetch("/api/method/frappe.core.doctype.user.user.update_password", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": csrfToken },
      body: JSON.stringify({
        key: key || "",
        old_password: oldPwd.value,
        new_password: newPwd.value,
        confirm_password: confirmPwd.value,
        logout_all_sessions: 1
      })
    })
      .then(function (r) { return r.json().then(function (body) { return { status: r.status, body: body }; }); })
      .then(function (res) {
        if (res.status === 200 && res.body.message) {
          showOk("{{ _('Your new password has been set successfully.') }}");
          setTimeout(function () { window.location.href = res.body.message; }, 1800);
        } else if (res.status === 401) {
          showErr("{{ _('Your old password is incorrect.') }}");
          submit.disabled = false;
        } else if (res.status === 410) {
          showErr((res.body && res.body.message) || "{{ _('This reset link is invalid or has expired.') }}");
          submit.disabled = false;
        } else {
          showErr((res.body && res.body.message) || "{{ _('Could not set password. Please try again.') }}");
          submit.disabled = false;
        }
      })
      .catch(function () {
        showErr("{{ _('Network error. Please try again.') }}");
        submit.disabled = false;
      })
      .finally(function () { submit.innerHTML = original; });
  });
})();
</script>
</body>
</html>
