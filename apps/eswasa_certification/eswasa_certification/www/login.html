<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#313391">
<title>{{ title }}</title>
<link rel="icon" href="/assets/eswasa_certification/images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ eswasa_css }}">
</head>
<body class="es-auth">
{% include "eswasa_certification/templates/includes/eswasa_line_icons.html" %}

<main class="es-card" id="es-card">
  <div class="es-head">
    <img class="es-logo" src="{{ eswasa_logo }}" alt="{{ app_name }}">
    <div class="es-title-text">
      <h1>{{ _("Sign In") }}</h1>
      <p class="es-subtitle">{{ _("Welcome back. Sign in to your account.") }}</p>
    </div>
  </div>

  <div class="es-banner err" id="es-err" hidden>
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-alert-circle"></use></svg>
    <span id="es-err-text"></span>
  </div>

  <form class="es-form" id="es-form" novalidate>
    <div class="es-field">
      <label class="es-label" for="login_email">{{ _("Email") }}</label>
      <div class="es-input-wrap has-icon-left">
        <svg class="es-icon-left" width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-mail"></use></svg>
        <input class="es-input" id="login_email" type="text" placeholder="jane@example.com" required autofocus autocomplete="username">
      </div>
      <p class="es-field-error" id="email-err"></p>
    </div>

    <div class="es-field">
      <label class="es-label" for="login_password">{{ _("Password") }}</label>
      <div class="es-input-wrap has-icon-left has-icon-right">
        <svg class="es-icon-left" width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-lock"></use></svg>
        <input class="es-input" id="login_password" type="password" placeholder="•••••" autocomplete="current-password" required>
        <svg class="es-icon-right" toggle="#login_password" width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-preview"></use></svg>
      </div>
      <p class="es-field-error" id="pwd-err"></p>
      <div style="text-align:right; margin-top:2px;">
        <a href="/forgot-password" style="color:var(--navy); font-size:13px; font-weight:600; text-decoration:none;">{{ _("Forgot password?") }}</a>
      </div>
    </div>

    <button class="es-btn es-btn-primary" type="submit" id="es-submit">
      {{ _("Continue") }}
    </button>
  </form>

  <div class="es-foot">
    <span>{{ _("New here?") }}</span>
    <a href="/signup">{{ _("Create an account") }}</a>
  </div>
</main>

<script>
(function () {
  var form = document.getElementById("es-form");
  var email = document.getElementById("login_email");
  var pwd = document.getElementById("login_password");
  var submit = document.getElementById("es-submit");
  var errBanner = document.getElementById("es-err");
  var errText = document.getElementById("es-err-text");
  var emailErr = document.getElementById("email-err");
  var pwdErr = document.getElementById("pwd-err");
  var csrfToken = "{{ csrf_token }}";
  var redirect = new URLSearchParams(location.search).get("redirect-to") || "";

  function showErr(msg) { errText.textContent = msg; errBanner.hidden = false; }
  function clearErr() { errBanner.hidden = true; emailErr.textContent = ""; pwdErr.textContent = ""; }

  document.querySelectorAll("[toggle]").forEach(function (el) {
    el.addEventListener("click", function () {
      var t = document.querySelector(el.getAttribute("toggle"));
      var isPwd = t.type === "password";
      t.type = isPwd ? "text" : "password";
      el.querySelector("use").setAttribute("href", isPwd ? "#es-line-hide" : "#es-line-preview");
    });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    clearErr();
    var valid = true;
    if (!email.value.trim()) { emailErr.textContent = "{{ _('Please enter your email.') }}"; valid = false; }
    if (!pwd.value) { pwdErr.textContent = "{{ _('Please enter your password.') }}"; valid = false; }
    if (!valid) return;

    submit.disabled = true;
    var original = submit.textContent;
    submit.innerHTML = '<span class="es-spin"></span>' + "{{ _('Signing in…') }}";

    var body = new URLSearchParams();
    body.append("usr", email.value.trim());
    body.append("pwd", pwd.value);

    fetch("/api/method/login", {
      method: "POST",
      headers: { "X-Frappe-CSRF-Token": csrfToken, "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, json: j }; }); })
      .then(function (res) {
        if (res.status === 200 && res.json.message === "Logged In") {
          var home = res.json.home_page || "/app";
          window.location.href = redirect || home;
        } else if (res.json.message === "Password Reset") {
          // Server forced a password reset; it provides redirect_to.
          window.location.href = res.json.redirect_to || "/update-password?password_expired=1";
        } else {
          showErr((res.json && res.json.message) || "{{ _('Invalid email or password.') }}");
          submit.disabled = false;
        }
      })
      .catch(function () {
        showErr("{{ _('Network error. Please try again.') }}");
        submit.disabled = false;
      })
      .finally(function () { submit.innerHTML = original; });
  });
})();
</script>
</body>
</html>
