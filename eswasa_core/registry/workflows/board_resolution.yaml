# Board Resolution — PORT of live Board Resolution Flow.

doctype: Board Resolution
module: governance
workflow_name: Board Resolution Flow
submit_gate: null
emit: true
phase: port
fixture_style: minimal
fixture_app: apps/eswasa_governance/eswasa_governance/fixtures
allow_self_approval_default: 0
approvals_family: approve
board_rollup: governance.resolutions
guards: [expected_state, idempotency_key]
notes: >
  Shares fixture_app workflow.json with Board Pack. Check matches by workflow name.
  Map promotion (Proposed → Passed / Implemented) later.

display:
  staff: {}
  customer: {}

states:
  - {name: Draft, allow_edit: Eswasa Board Secretary, owner_role: Eswasa Board Secretary}
  - {name: Review, allow_edit: Eswasa Board Secretary, owner_role: Eswasa Board Secretary}
  - {name: Adopted, allow_edit: Eswasa Board Secretary, owner_role: Eswasa Board Secretary}

transitions:
  - action: Submit for Review
    from: Draft
    to: Review
    actor: Eswasa Board Secretary
    allow_self_approval: 0
    approvals_family: do

  - action: Adopt
    from: Review
    to: Adopted
    actor: Eswasa Board Member
    allow_self_approval: 0
    rules: [R-G2]
    approvals_family: approve

  - action: Return to Draft
    from: Review
    to: Draft
    actor: Eswasa Board Member
    allow_self_approval: 0
    reason: required
    approvals_family: do
