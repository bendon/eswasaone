# EswasaOne — eswasaone.aiceafrica.com
# Service Portal :3015 · Institution Portal :3016 · Core :8015
# Copy to /etc/nginx/sites-available/ and enable after certbot.
# Orchestrator-owned; do not edit from feature agents.

upstream eswasaone_core {
  server 127.0.0.1:8015;
  keepalive 32;
}

upstream eswasaone_service {
  server 127.0.0.1:3015;
}

upstream eswasaone_institution {
  server 127.0.0.1:3016;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name eswasaone.aiceafrica.com;

  # ssl_certificate     /etc/letsencrypt/live/eswasaone.aiceafrica.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/eswasaone.aiceafrica.com/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 50m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://eswasaone_core;
  }

  location /ws/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://eswasaone_core;
  }

  location /institution/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://eswasaone_institution/;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://eswasaone_service;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name eswasaone.aiceafrica.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
