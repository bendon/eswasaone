<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E7C7B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>EswasaOne — Service Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* EswasaOne Service Portal — design system v4 (floating dock) */
:root{
  --bg:#F4F7FA; --card:#FFFFFF;
  --ink:#0B1524; --muted:#5A6B84; --muted-2:#8A9AB1;
  --line:#E4EAF2; --line-2:#EFF3F8;
  --gold:#E0A81E; --gold-ink:#3A2A05;
  --teal:#0E7C7B; --teal-d:#0B6463; --teal-l:#E4F4F1;
  --navy:#12263F;
  --green:#16A34A; --red:#E11D6E; --blue:#2563EB; --purple:#7C3AED;
  --r-sm:10px; --r:14px; --r-lg:18px; --r-xl:24px;
  --sh-xs:0 1px 2px rgba(16,24,40,.05);
  --sh-sm:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --sh-md:0 6px 16px -4px rgba(16,24,40,.10),0 2px 6px -2px rgba(16,24,40,.05);
  --sh-lg:0 20px 44px -20px rgba(16,24,40,.24);
  --maxw:1400px; --nav-h:68px; --gutter:32px;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none !important}
svg{flex:0 0 auto}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}

/* Top nav, hero, chat, services, guide, etc. — see full file for details.
   Key change: .askbar-sticky replaced by .dock (floating bottom-right). */
</style>
</head>

</body>
</html>
