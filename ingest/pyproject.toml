[project]
name = "eswasaone-ingest"
version = "0.1.0"
description = "EswasaOne knowledge ingestion worker"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["ruff", "black", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["connectors*", "processing*", "enrich*"]
