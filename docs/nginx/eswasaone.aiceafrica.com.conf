# EswasaOne — eswasaone.aiceafrica.com
# Service Portal :3015 · Institution Portal :3016 · Field Portal :3017 · Core :8015
# Frappe :8020 — password-set page + branded assets only (not full Desk)

upstream eswasaone_core {
  server 127.0.0.1:8015;
  keepalive 32;
}

upstream eswasaone_service {
  server 127.0.0.1:3015;
}

upstream eswasaone_institution {
  server 127.0.0.1:3016;
}

upstream eswasaone_field {
  server 127.0.0.1:3017;
}

upstream eswasaone_frappe {
  server 127.0.0.1:8020;
  keepalive 8;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name eswasaone.aiceafrica.com;

  ssl_certificate     /etc/letsencrypt/live/eswasaone.aiceafrica.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/eswasaone.aiceafrica.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 50m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # --- Public invite / password links (Frappe) — before Core /api/ ---
  location = /update-password {
    proxy_http_version 1.1;
    proxy_set_header Host eswasaone.localhost;
    proxy_set_header X-Frappe-Site-Name eswasaone.localhost;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://eswasaone_frappe;
  }

  location = /website_script.js {
    proxy_http_version 1.1;
    proxy_set_header Host eswasaone.localhost;
    proxy_set_header X-Frappe-Site-Name eswasaone.localhost;
    proxy_pass http://eswasaone_frappe;
  }

  location ~ ^/assets/(frappe|erpnext|hrms|crm|lms|payments|eswasa_)/ {
    proxy_http_version 1.1;
    proxy_set_header Host eswasaone.localhost;
    proxy_set_header X-Frappe-Site-Name eswasaone.localhost;
    proxy_pass http://eswasaone_frappe;
  }

  location ~ ^/api/method/frappe\.core\.doctype\.user\.user\.(update_password|test_password_strength)$ {
    proxy_http_version 1.1;
    proxy_set_header Host eswasaone.localhost;
    proxy_set_header X-Frappe-Site-Name eswasaone.localhost;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://eswasaone_frappe;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://eswasaone_core;
  }

  location /ws/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://eswasaone_core;
  }

  location /institution/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://eswasaone_institution;
  }

  # Field PWA — requires portals/field-portal Vite (or preview) on 127.0.0.1:3017.
  # If this upstream is down, do NOT fall through to Service (:3015).
  location /field/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://eswasaone_field;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 @field_down;
  }

  location @field_down {
    default_type text/plain;
    return 503 "EswasaOne Field portal unavailable — start portals/field-portal on :3017\n";
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://eswasaone_service;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name eswasaone.aiceafrica.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
