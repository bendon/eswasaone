components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:
    InstitutionHome:
      type: object
      required: [kpis, modules, feed]
      properties:
        kpis:
          type: array
          items: { $ref: "#/components/schemas/Kpi" }
        modules:
          type: array
          items: { $ref: "#/components/schemas/ModuleTile" }
        feed:
          type: array
          items: { $ref: "#/components/schemas/FeedItem" }

    ServiceHome:
      type: object
      required: [stats, services, recent_activity, alerts]
      properties:
        stats:
          type: array
          items: { $ref: "#/components/schemas/Kpi" }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceCard" }
        recent_activity:
          type: array
          items: { $ref: "#/components/schemas/FeedItem" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/FeedItem" }

    Kpi:
      type: object
      required: [key, label, value]
      properties:
        key: { type: string }
        label: { type: string }
        value: {}
        trend: { type: string }
        status:
          type: string
          enum: [ok, warn, critical, unknown]

    ModuleTile:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        href: { type: string }
        watermark: { type: string }

    ServiceCard:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        href: { type: string }

    FeedItem:
      type: object
      required: [id, type, title, created_at]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        severity:
          type: string
          enum: [info, success, warn, critical]
        created_at: { type: string, format: date-time }
        href: { type: string }

    CertificationApplication:
      type: object
      required: [id, scheme, applicant, status]
      properties:
        id: { type: string }
        scheme: { type: string }
        applicant: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        quote: { $ref: "#/components/schemas/CertificationQuote" }

    CertificationScheme:
      type: object
      required: [code, name, scheme_type]
      properties:
        code: { type: string }
        name: { type: string }
        standard_ref: { type: string, nullable: true }
        scheme_type: { type: string, enum: ["Management System", "Product"] }
        accreditation_basis: { type: string, nullable: true }
        surveillance_interval_months: { type: integer, nullable: true }
        certificate_validity_months: { type: integer, nullable: true }
        fee: { type: number, nullable: true }
        description: { type: string, nullable: true }

    CertificationScheme:
      type: object
      required: [code, name, scheme_type]
      properties:
        code: { type: string }
        name: { type: string }
        standard_ref: { type: string, nullable: true }
        scheme_type: { type: string, enum: ["Management System", "Product"] }
        accreditation_basis: { type: string, nullable: true }
        surveillance_interval_months: { type: integer, nullable: true }
        certificate_validity_months: { type: integer, nullable: true }
        fee: { type: number, nullable: true }
        description: { type: string, nullable: true }

    CreateCertificationApplication:
      type: object
      required: [scheme, applicant_name, confirm]
      properties:
        scheme: { type: string }
        applicant_name: { type: string }
        contact_email: { type: string, format: email }
        confirm: { type: boolean }

    CertificationQuoteLine:
      type: object
      required: [label, amount]
      properties:
        label: { type: string }
        amount: { type: number }

    CertificationQuote:
      type: object
      required: [id, status, flow, org, contact_email, standards, scope, requested_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [requested, issued, accepted, declined, expired] }
        flow: { type: string, enum: [ms, product, ingelo, combined] }
        org: { type: string }
        contact: { type: string }
        contact_email: { type: string }
        phone: { type: string }
        standards: { type: string }
        scope: { type: string }
        employees: { type: string }
        sites: { type: string }
        requested_at: { type: string, format: date-time }
        issued_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CertificationQuoteLine" }
        total: { type: number }
        application_id: { type: string }
        notes: { type: string }
        pdf_url: { type: string, description: Citizen-accessible quotation PDF (S3 or /api/media) }
        pdf_key: { type: string }

    CreateCertificationQuote:
      type: object
      required: [org, email, confirm]
      properties:
        confirm: { type: boolean }
        flow: { type: string, enum: [ms, product, ingelo, combined] }
        org: { type: string }
        registration_no: { type: string }
        contact: { type: string }
        position: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        standards: { type: string }
        scope: { type: string }
        employees: { type: string }
        sites: { type: string }
        based_in_eswatini: { type: string }
        made_in_eswatini: { type: string }
        existing_certs: { type: string }
        timeline: { type: string }
        comments: { type: string }

    IssueCertificationQuote:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CertificationQuoteLine" }
        valid_days: { type: integer, default: 30 }
        notes: { type: string }

    AuditSummary:
      type: object
      required: [id, application_id, due_date, status]
      properties:
        id: { type: string }
        application_id: { type: string }
        auditor: { type: string }
        scheme: { type: string }
        due_date: { type: string, format: date }
        status: { type: string }

    StandardSummary:
      type: object
      required: [code, title]
      properties:
        code: { type: string }
        title: { type: string }
        sector: { type: string }
        status: { type: string }
        buy_url: { type: string }

    CheckoutResult:
      type: object
      required: [order_id, status]
      properties:
        order_id: { type: string }
        status: { type: string }
        payment_ref: { type: string }
        momo_reference: { type: string }

    VerificationResult:
      type: object
      required: [valid, token]
      properties:
        valid: { type: boolean }
        token: { type: string }
        subject: { type: string }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        details: { type: object, additionalProperties: true }

    AgentAskRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }
        context:
          type: object
          additionalProperties: true
        confirm_action_id: { type: string }

    AgentAskResponse:
      type: object
      required: [answer]
      properties:
        answer: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        tools_used:
          type: array
          items: { type: string }
        pending_action:
          $ref: "#/components/schemas/PendingAction"
        buy_links:
          type: array
          items: { $ref: "#/components/schemas/BuyLink" }

    Citation:
      type: object
      required: [source_id, title, rights]
      properties:
        source_id: { type: string }
        title: { type: string }
        rights:
          type: string
          enum: [open, public, licensed]
        url: { type: string }
        excerpt: { type: string }

    PendingAction:
      type: object
      required: [id, tool, summary]
      properties:
        id: { type: string }
        tool: { type: string }
        summary: { type: string }
        mutates: { type: boolean }

    BuyLink:
      type: object
      required: [standard_code, url]
      properties:
        standard_code: { type: string }
        title: { type: string }
        url: { type: string }

    ApplicabilityResult:
      type: object
      required: [summary, steps, citations]
      properties:
        summary: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [order, title]
            properties:
              order: { type: integer }
              title: { type: string }
              detail: { type: string }
              href: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        buy_links:
          type: array
          items: { $ref: "#/components/schemas/BuyLink" }

    Session:
      type: object
      required: [access_token, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, default: bearer }
        user: { $ref: "#/components/schemas/SessionUser" }

    SessionUser:
      type: object
      required: [username, full_name, roles]
      properties:
        username: { type: string }
        full_name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { type: string }

    AllowedAction:
      type: object
      required: [action, label]
      properties:
        action: { type: string }
        label: { type: string }
        rule_id: { type: string, nullable: true }
        danger: { type: boolean, default: false }
        consequence: { type: string, nullable: true }

    ConfirmBody:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean }

    WorkflowActBody:
      type: object
      required: [action, confirm]
      description: Generic workflow transition (map §1.2 / §5.2)
      properties:
        action: { type: string, description: Workflow action slug or Desk label }
        confirm: { type: boolean }
        expected_state:
          type: string
          description: Must match current workflow_state (optimistic concurrency)
          nullable: true
        idempotency_key:
          type: string
          description: Replay returns the original result (L4); TTL 7 days
          nullable: true
        reason:
          type: string
          description: Required for reject/return/withdraw/suspend/cancel/override
          nullable: true
        comment: { type: string, nullable: true }
        payload:
          type: object
          additionalProperties: true
          nullable: true

    AuditPatchBody:
      type: object
      required: [action, confirm]
      properties:
        action: { type: string }
        confirm: { type: boolean }
        payload: { type: object, additionalProperties: true }

    BallotVoteBody:
      type: object
      required: [vote, confirm]
      properties:
        vote: { type: string, enum: [approve, disapprove, abstain] }
        comment: { type: string }
        confirm: { type: boolean }

    EscalateBody:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean }
        reason: { type: string }

    CartItemBody:
      type: object
      required: [code]
      properties:
        code: { type: string }
        qty: { type: integer, default: 1 }

    CartBody:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItemBody" }
        confirm: { type: boolean }

    AccessRequestBody:
      type: object
      required: [reason, confirm]
      properties:
        reason: { type: string }
        requested_roles:
          type: array
          items: { type: string }
        confirm: { type: boolean }

    # --- Board & Governance schemas (WS-I5) ---------------------------------

    PackSectionStatus:
      type: string
      enum: [awaiting, ready, overdue]

    PackSectionSource:
      type: string
      enum: [live_module, upload, secretariat]

    PackSection:
      type: object
      required: [id, title, status, included]
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/PackSectionStatus" }
        included: { type: boolean }
        source: { $ref: "#/components/schemas/PackSectionSource" }
        module_key: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        idx: { type: integer, nullable: true }
        file_url: { type: string, nullable: true }
        restricted: { type: boolean, default: false }

    PackTrack:
      type: object
      required: [sections]
      description: Segmented pack readiness track for Overview / meeting drawer
      properties:
        pack_id: { type: string, nullable: true }
        meeting_id: { type: string, nullable: true }
        due_label: { type: string, nullable: true }
        outstanding_sections: { type: integer, default: 0 }
        sections:
          type: array
          items: { $ref: "#/components/schemas/PackSection" }

    GovernanceKpis:
      type: object
      properties:
        open_actions: { type: integer, default: 0 }
        overdue_actions: { type: integer, default: 0 }
        high_critical_risks: { type: integer, default: 0 }
        worsening_risks: { type: integer, default: 0 }
        board_attendance_pct: { type: number, nullable: true }
        declarations_due: { type: integer, default: 0 }

    GovernanceCalendarItem:
      type: object
      required: [id, title, date]
      properties:
        id: { type: string }
        title: { type: string }
        date: { type: string, format: date }
        kind: { type: string, nullable: true }
        href: { type: string, nullable: true }

    GovernanceOverview:
      type: object
      required: [kpis, pack_track, calendar, overdue_actions, recent_resolutions]
      properties:
        next_meeting: { $ref: "#/components/schemas/GovernanceMeeting", nullable: true }
        pack_track: { $ref: "#/components/schemas/PackTrack" }
        kpis: { $ref: "#/components/schemas/GovernanceKpis" }
        calendar:
          type: array
          items: { $ref: "#/components/schemas/GovernanceCalendarItem" }
        overdue_actions:
          type: array
          items: { $ref: "#/components/schemas/ResolutionAction" }
        recent_resolutions:
          type: array
          items: { $ref: "#/components/schemas/GovernanceResolution" }
        heat_cells:
          type: array
          description: Optional 5×5 residual L×I counts for Overview heat map
          items:
            type: object
            required: [L, I, count]
            properties:
              L: { type: integer }
              I: { type: integer }
              count: { type: integer }

    MeetingAgendaItem:
      type: object
      required: [id, item]
      properties:
        id: { type: string }
        item: { type: string }
        presenter: { type: string, nullable: true }
        purpose: { type: string, nullable: true }
        paper: { type: string, nullable: true }

    MeetingAttendance:
      type: object
      required: [member]
      properties:
        member: { type: string }
        member_name: { type: string, nullable: true }
        rsvp: { type: string, nullable: true }
        attended: { type: boolean, nullable: true }
        apology: { type: boolean, nullable: true }

    GovernanceMeeting:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string, nullable: true }
        body_name: { type: string, nullable: true }
        meeting_type:
          type: string
          enum: [Ordinary, Special, AGM]
          nullable: true
        date: { type: string, format: date, nullable: true }
        start_time: { type: string, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        venue: { type: string, nullable: true }
        hybrid: { type: boolean, default: false }
        online_link: { type: string, nullable: true }
        pack_deadline: { type: string, format: date, nullable: true }
        status: { type: string }
        agenda:
          type: array
          items: { $ref: "#/components/schemas/MeetingAgendaItem" }
        attendance:
          type: array
          items: { $ref: "#/components/schemas/MeetingAttendance" }
        pack_id: { type: string, nullable: true }
        pack_track: { $ref: "#/components/schemas/PackTrack", nullable: true }
        allowed_actions:
          type: array
          items: { $ref: "#/components/schemas/AllowedAction" }

    GovernanceMeetingCreate:
      type: object
      required: [title, confirm]
      properties:
        title: { type: string }
        body: { type: string, nullable: true }
        meeting_type:
          type: string
          enum: [Ordinary, Special, AGM]
          default: Ordinary
        date: { type: string, format: date }
        start_time: { type: string }
        scheduled_at: { type: string, format: date-time }
        venue: { type: string }
        hybrid: { type: boolean, default: false }
        online_link: { type: string }
        pack_deadline: { type: string, format: date }
        confirm: { type: boolean }

    GovernanceMeetingAct:
      type: object
      required: [action, confirm]
      properties:
        action:
          type: string
          enum:
            - reschedule
            - cancel
            - record_attendance
            - start_minutes
            - submit_minutes
            - approve_minutes
        confirm: { type: boolean }
        payload:
          type: object
          additionalProperties: true
          description: Action-specific fields (new dates, attendance rows, etc.)

    GovernancePack:
      type: object
      required: [id, meeting, status, sections]
      properties:
        id: { type: string }
        meeting: { type: string }
        meeting_title: { type: string, nullable: true }
        version: { type: integer, default: 1 }
        status:
          type: string
          enum: [Draft, Assembled, Issued]
        sections:
          type: array
          items: { $ref: "#/components/schemas/PackSection" }
        assembled_file: { type: string, nullable: true }
        pages: { type: integer, nullable: true }
        issued_on: { type: string, format: date-time, nullable: true }
        due_label: { type: string, nullable: true }
        outstanding_sections: { type: integer, default: 0 }
        allowed_actions:
          type: array
          items: { $ref: "#/components/schemas/AllowedAction" }

    GovernancePackSectionPatch:
      type: object
      required: [id]
      properties:
        id: { type: string }
        included: { type: boolean }
        idx: { type: integer }
        status: { $ref: "#/components/schemas/PackSectionStatus" }
        mark_ready: { type: boolean }

    GovernancePackSectionsPatch:
      type: object
      required: [confirm, sections]
      properties:
        confirm: { type: boolean }
        sections:
          type: array
          items: { $ref: "#/components/schemas/GovernancePackSectionPatch" }

    GovernancePackAssembleResult:
      type: object
      required: [id, version]
      properties:
        id: { type: string }
        version: { type: integer }
        pages: { type: integer, nullable: true }
        file_url: { type: string, nullable: true }
        status: { type: string, nullable: true }

    BoardPackSummary:
      type: object
      description: Deprecated thin summary — prefer GovernancePack / PackTrack
      required: [due_label, outstanding_sections, sections]
      properties:
        due_label: { type: string }
        outstanding_sections: { type: integer }
        sections:
          type: array
          items:
            type: object
            required: [title, status]
            properties:
              title: { type: string }
              status: { type: string }

    GovernanceResolution:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string }
        title: { type: string }
        meeting: { type: string, nullable: true }
        text: { type: string, nullable: true }
        outcome:
          type: string
          enum: [Passed, Rejected, Deferred]
          nullable: true
        votes_for: { type: integer, nullable: true }
        votes_against: { type: integer, nullable: true }
        votes_abstained: { type: integer, nullable: true }
        status: { type: string }
        date: { type: string, format: date, nullable: true }
        allowed_actions:
          type: array
          items: { $ref: "#/components/schemas/AllowedAction" }

    ResolutionAction:
      type: object
      required: [id, description, status]
      properties:
        id: { type: string }
        resolution: { type: string, nullable: true }
        description: { type: string }
        owner: { type: string, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        progress: { type: integer, minimum: 0, maximum: 100, default: 0 }
        status:
          type: string
          enum: [Open, Overdue, Completed]
        report_in_pack: { type: boolean, default: false }

    RiskBand:
      type: string
      enum: [critical, high, medium, low]

    RiskTrend:
      type: string
      enum: [improving, stable, worsening]

    GovernanceRisk:
      type: object
      required: [id, title, status, residual_likelihood, residual_impact, score, band]
      properties:
        id: { type: string }
        title: { type: string }
        cause_consequence: { type: string, nullable: true }
        category: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        inherent_likelihood: { type: integer, minimum: 1, maximum: 5, nullable: true }
        inherent_impact: { type: integer, minimum: 1, maximum: 5, nullable: true }
        controls: { type: string, nullable: true }
        residual_likelihood: { type: integer, minimum: 1, maximum: 5 }
        residual_impact: { type: integer, minimum: 1, maximum: 5 }
        score:
          type: integer
          description: Server-computed residual L × I
        band: { $ref: "#/components/schemas/RiskBand" }
        trend: { $ref: "#/components/schemas/RiskTrend", nullable: true }
        appetite_threshold: { type: integer, nullable: true }
        status: { type: string }
        flagged_for_pack: { type: boolean, default: false }

    BoardMember:
      type: object
      required: [id, full_name]
      properties:
        id: { type: string }
        full_name: { type: string }
        title: { type: string, nullable: true }
        role:
          type: string
          enum: [Chair, Vice, Member, Ex officio]
          nullable: true
        committees:
          type: array
          items: { type: string }
        term_start: { type: string, format: date, nullable: true }
        term_end: { type: string, format: date, nullable: true }
        attendance_pct: { type: number, nullable: true }
        declaration_due: { type: boolean, default: false }

    GovernanceBody:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [Board, Committee]
        chair: { type: string, nullable: true }
        quorum: { type: integer, nullable: true }
        meeting_frequency: { type: string, nullable: true }
        members:
          type: array
          items: { type: string }

    GovernanceDeclaration:
      type: object
      required: [id, member, kind, interest, filed_on]
      properties:
        id: { type: string }
        member: { type: string }
        member_name: { type: string, nullable: true }
        kind:
          type: string
          enum: [Annual, Meeting]
        meeting: { type: string, nullable: true }
        agenda_item: { type: string, nullable: true }
        interest: { type: string }
        action:
          type: string
          enum: [Recuse, Note]
          nullable: true
        filed_on: { type: string, format: date }

    # Aliases kept for older portal list shapes
    GovernanceMeetingSummary:
      allOf:
        - $ref: "#/components/schemas/GovernanceMeeting"
    GovernanceResolutionSummary:
      allOf:
        - $ref: "#/components/schemas/GovernanceResolution"
    GovernanceRiskSummary:
