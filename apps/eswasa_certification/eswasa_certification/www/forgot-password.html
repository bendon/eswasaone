<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#313391">
<title>{{ title }}</title>
<link rel="icon" href="/assets/eswasa_certification/images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ eswasa_css }}">
</head>
<body class="es-auth">
{% include "eswasa_certification/templates/includes/eswasa_line_icons.html" %}

<main class="es-card" id="es-card">
  <div class="es-head">
    <img class="es-logo" src="{{ eswasa_logo }}" alt="EswasaOne">
    <div class="es-title-text">
      <h1>{{ _("Forgot Password") }}</h1>
      <p class="es-subtitle">{{ _("Enter your account email and we'll send you a reset link.") }}</p>
    </div>
  </div>

  <div class="es-banner ok" id="es-ok" hidden>
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-check-circle"></use></svg>
    <span id="es-ok-text"></span>
  </div>
  <div class="es-banner err" id="es-err" hidden>
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-alert-circle"></use></svg>
    <span id="es-err-text"></span>
  </div>

  <form class="es-form" id="es-form" novalidate>
    <div class="es-field">
      <label class="es-label" for="forgot_email">{{ _("Email") }}</label>
      <div class="es-input-wrap has-icon-left">
        <svg class="es-icon-left" width="18" height="18" viewBox="0 0 16 16" fill="none"><use href="#es-line-mail"></use></svg>
        <input class="es-input" id="forgot_email" type="email" placeholder="jane@example.com" required autofocus autocomplete="username">
      </div>
      <p class="es-field-error" id="email-err"></p>
    </div>

    <button class="es-btn es-btn-primary" type="submit" id="es-submit">
      {{ _("Send reset link") }}
    </button>
  </form>

  <div class="es-foot">
    <span>{{ _("Remember your password?") }}</span>
    <a href="/login">{{ _("Back to sign in") }}</a>
  </div>
</main>

<script>
(function () {
  var form = document.getElementById("es-form");
  var email = document.getElementById("forgot_email");
  var submit = document.getElementById("es-submit");
  var emailErr = document.getElementById("email-err");
  var okBanner = document.getElementById("es-ok");
  var okText = document.getElementById("es-ok-text");
  var errBanner = document.getElementById("es-err");
  var errText = document.getElementById("es-err-text");
  var csrfToken = "{{ csrf_token }}";

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    emailErr.textContent = "";
    errBanner.hidden = true;
    okBanner.hidden = true;

    if (!email.value.trim()) {
      emailErr.textContent = "{{ _('Please enter your email.') }}";
      return;
    }

    submit.disabled = true;
    var original = submit.textContent;
    submit.innerHTML = '<span class="es-spin"></span>' + "{{ _('Sending…') }}";

    var body = new URLSearchParams();
    body.append("user", email.value.trim());

    fetch("/api/method/frappe.core.doctype.user.user.reset_password", {
      method: "POST",
      headers: { "X-Frappe-CSRF-Token": csrfToken, "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        // Frappe always returns the same generic message (anti-enumeration).
        okText.textContent = json.message || "{{ _('If that account exists, a reset link has been sent to your email.') }}";
        okBanner.hidden = false;
        form.hidden = true;
      })
      .catch(function () {
        errText.textContent = "{{ _('Could not send reset link. Please try again.') }}";
        errBanner.hidden = false;
        submit.disabled = false;
      })
      .finally(function () { submit.innerHTML = original; });
  });
})();
</script>
</body>
</html>
