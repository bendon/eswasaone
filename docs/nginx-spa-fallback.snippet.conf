# SPA fallback for Service Portal (when serving `vite build` static files)

# Use instead of (or after) the Vite-dev proxy for location / :
#   root /srv/projects/eswasaone/portals/service-portal/dist;
#   try_files $uri $uri/ /index.html;

# While proxying to Vite (:3015), Vite's SPA middleware already rewrites
# unknown paths to index.html — deep links like /standards/SZNS-060 work.

location / {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_pass http://eswasaone_service;
}
