[project]
name = "eswasaone-core"
version = "0.1.0"
description = "EswasaOne Core — FastAPI BFF, identity broker, agent orchestration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "redis>=5.0",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["ruff", "black", "pytest", "pytest-asyncio", "httpx"]
s3 = ["boto3>=1.34"]
pdf = ["reportlab>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
